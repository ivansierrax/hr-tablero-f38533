function b(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})}
async function open(pw){
  var k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},k,b(D.c));
  return new TextDecoder().decode(pt);
}
async function go(pw){
  document.getElementById('e').textContent='';
  try{var h=await open(pw);try{sessionStorage.setItem('hrpw',pw)}catch(x){}document.open();document.write(h);document.close();}
  catch(x){document.getElementById('e').textContent='Contraseña incorrecta.';try{sessionStorage.removeItem('hrpw')}catch(y){}}
}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();go(document.getElementById('p').value)});
try{var s=sessionStorage.getItem('hrpw');if(s)go(s)}catch(x){}
